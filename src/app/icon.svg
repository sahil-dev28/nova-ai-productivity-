    <stop offset="0" stop-color="#7c5cff" />
    <stop offset="1" stop-color="#22d3ee" />
  </linearGradient>
  <rect width="32" height="32" rx="10" fill="url(#mark)" />
  <path d="M9 8H13L19 17.5V8H23V24H19L13 14.5V24H9Z" fill="#ffffff" />
</svg>
